[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "s5-nano-evals"
version = "0.1.0.dev0"
description = "Private reproducible evaluation suite for s5-nano"
requires-python = ">=3.11,<3.14"

[project.scripts]
s5-nano = "s5_nano.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
